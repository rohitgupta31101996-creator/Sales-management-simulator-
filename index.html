<!doctype html><html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>rohitguptaskills • Sales Lab</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app"></div><div id="toast"></div><script>
'use strict';
const KEY='rohit-sales-lab-v1';let db={version:1,profiles:[]},p=null,tab='Dashboard',selectedMarket=null,logged=false;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const id=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,9);const num=v=>Number(v)||0;const fmt=n=>Number(n).toLocaleString('en-IN');const today=()=>new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Kolkata',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());
const markets=()=>['Laxmi Nagar','Shakarpur','Preet Vihar','Nirman Vihar','Patparganj','Mayur Vihar'].map((name,i)=>({id:id(),name,x:[24,28,68,55,73,53][i],y:[30,60,22,43,66,84][i],demand:[.8,.7,.75,.85,.65,.8][i]}));
function message(s){document.getElementById('toast').innerHTML='<div class="notice">'+esc(s)+'</div>';setTimeout(()=>document.getElementById('toast').innerHTML='',3500)}
function save(){try{localStorage.setItem(KEY,JSON.stringify(db));return true}catch(e){message('Save nahi hua: storage unavailable/full. JSON backup download karein.');return false}}
try{const raw=localStorage.getItem(KEY);if(raw){let d=JSON.parse(raw);if(d.version===1&&Array.isArray(d.profiles))db=d;else throw Error()}}catch(e){setTimeout(()=>message('Local storage read nahi hui. Backup import karein; is session ka backup zaroor lein.'),500)}
function active(a){return a.filter(x=>!x.archived)}function current(){return p.run.days[p.run.days.length-1]}function complete(){return p.run.days.length===5&&current().closed}function editable(){return !current().closed&&!complete()}
function newRun(start=today()){return {id:id(),seed:id(),start,mode:'training',days:[{n:1,plans:{},closed:false,rows:[]}],archives:[]}}
function addProfile(name){if(!name.trim())return; p={id:id(),name:name.trim(),company:'rohitguptaskills',target:1000,products:[],team:[],markets:markets(),mapImage:null,run:newRun(),history:[],audit:[],lastBackup:null};db.profiles.push(p);save();render()}
function audit(s){p.audit.push({at:new Date().toISOString(),day:current().n,text:s});if(p.audit.length>500)p.audit.shift()}
function login(){let u=document.getElementById('user').value,w=document.getElementById('pass').value;if(u==='SALES'&&w==='SALES'){logged=true;profiles()}else message('User ID ya password galat hai.')}
function profiles(){p=null;document.getElementById('app').innerHTML='<main class="login"><div class="card"><span class="pill">SALES LAB • OFFLINE</span><h1>Apna workspace chunein</h1><p class="muted">Har learner ki team aur reports alag rahengi.</p>'+db.profiles.map(x=>'<button class="secondary" style="width:100%;margin:5px 0" onclick="selectProfile(\''+x.id+'\')">'+esc(x.name)+' <small>· '+esc(x.id.slice(-5))+'</small></button>').join('')+'<hr><label>Naya learner name</label><input id="profileName" placeholder="Apna naam"><p><button onclick="addProfile(document.getElementById(\'profileName\').value)">Create workspace</button></p><button class="secondary" onclick="importBackup()">Import JSON backup</button></div></main>'}
function selectProfile(pid){p=db.profiles.find(x=>x.id===pid);tab='Dashboard';reconcile();render()}
function navigate(t){tab=t;render()}
function stats(){let rows=p.run.days.flatMap(d=>d.rows);return {rows,points:rows.reduce((s,r)=>s+r.points,0),revenue:rows.reduce((s,r)=>s+r.revenue,0)}}
function planFor(cid){return current().plans[cid]??={market:'',visits:20,followups:5,coaching:false,priority:'Normal',note:'',targets:{},punch:false}}
function plannedPoints(pl){return Object.entries(pl.targets).reduce((s,[pid,n])=>s+num(n)*num(p.products.find(x=>x.id===pid)?.points),0)}
function shell(content){document.getElementById('app').innerHTML='<header><div><small>ROHITGUPTASKILLS / SALES LAB</small><h1>'+esc(p.company)+'</h1></div><div><span class="pill">Offline simulation</span><p style="margin:8px 0 0">'+esc(p.name)+' · Day '+current().n+'/5</p></div></header><nav>'+['Dashboard','Products','Team','Plan','Markets','Reports','Settings'].map(t=>'<button class="'+(tab===t?'active':'')+'" onclick="navigate(\''+t+'\')">'+t+'</button>').join('')+'</nav><main>'+content+'</main>'}
function render(){if(!p)return;const screens={Dashboard:dashboard,Products:products,Team:team,Plan:planning,Markets:marketView,Reports:reports,Settings:settings};shell(screens[tab]())}
function stat(label,value,foot=''){return '<div class="card stat"><small>'+label+'</small><b>'+value+'</b><small>'+foot+'</small></div>'}
function dashboard(){let s=stats(),d=current(),target=Object.values(d.plans).reduce((a,x)=>a+plannedPoints(x),0);return '<div class="card hero"><span class="pill">'+(p.run.mode==='training'?'TRAINING CLOCK':'REAL TIME · IST')+'</span><h1>'+ (complete()?'Five days complete. Review your performance.':d.closed?'Aaj ka report ready hai.':'Plan your people. Grow your sales.')+'</h1><p class="muted">10 AM par targets aur markets plan karein. 6 PM par virtual team ke results dekhein.</p><div class="row"><button onclick="navigate(\'Plan\')">Daily plan kholein →</button>'+(p.run.mode==='training'?'<button class="secondary" onclick="advance()">'+(d.closed?(complete()?'Simulation complete':'Next day → 10 AM'):'Close day → 6 PM report')+'</button>':'<span>Next report: '+dayDate(d.n)+' · 18:00 IST</span>')+'</div></div><div class="grid">'+stat('Company target',fmt(p.target),'Five-day sales points')+stat('Achieved points',fmt(s.points),(p.target?Math.round(s.points/p.target*100):0)+'% of company target')+stat('Today allocated',fmt(target),'Daily target points')+stat('Revenue', '₹'+fmt(s.revenue),'Simulated sales')+'</div><div class="grid"><div class="card"><h3>Your setup</h3><p>'+active(p.products).length+' products · '+active(p.team).length+'/10 team members</p><p>'+coverage()+'% market coverage today</p><progress max="100" value="'+coverage()+'"></progress><p class="muted">Remaining company target: '+fmt(Math.max(0,p.target-s.points))+' points</p><button class="secondary" onclick="sample()">Load sample team & products</button></div><div class="card"><h3>Five-day journey</h3>'+Array.from({length:5},(_,i)=>{let day=p.run.days[i];return '<p><span class="pill">Day '+(i+1)+'</span> '+dayDate(i+1)+' · '+(day?.closed?'Report ready':day?'Planning':'Upcoming')+'</p>'}).join('')+'</div></div><div class="warning">Training data hai, real sales/GPS attendance nahi. App band ho toh 6 PM report next open par banegi. Data safe rakhne ke liye Settings se backup lein.</div>'}
function products(){return '<h2>Products & stock</h2><div class="card"><div class="formgrid"><div><label>Product name</label><input id="pn" placeholder="Mobile protection"></div><div><label>Price ₹</label><input id="price" type="number" min="0" value="499"></div><div><label>Points per unit</label><input id="points" type="number" min="1" value="10"></div><div><label>Available stock</label><input id="stock" type="number" min="0" value="100"></div><div><label>Best-fit market</label><select id="fit"><option value="">All markets</option>'+p.markets.map(m=>'<option value="'+m.id+'">'+esc(m.name)+'</option>').join('')+'</select></div></div><button onclick="addProduct()">+ Add product</button></div><div class="card table"><table><tr><th>Product</th><th>Price</th><th>Points/unit</th><th>Stock</th><th>Action</th></tr>'+active(p.products).map(x=>'<tr><td>'+esc(x.name)+'</td><td>₹'+fmt(x.price)+'</td><td>'+x.points+'</td><td>'+x.stock+'</td><td><button class="secondary" onclick="restock(\''+x.id+'\')">Stock +</button> <button class="danger" onclick="archive(\'products\',\''+x.id+'\')">Archive</button></td></tr>').join('')+'</table></div>'}
function addProduct(){let name=document.getElementById('pn').value.trim(),price=num(document.getElementById('price').value),points=num(document.getElementById('points').value),stock=num(document.getElementById('stock').value);if(!name||price<0||points<=0||stock<0||!Number.isInteger(stock))return message('Valid name, price, points aur whole-number stock dein.');p.products.push({id:id(),name,price,points,stock,fit:document.getElementById('fit').value});audit('Product added: '+name);save();render()}
function restock(pid){const v=prompt('Kitna stock add karna hai?');if(v===null)return;const n=Number(v);if(!Number.isInteger(n)||n<0)return message('Positive whole number dein');p.products.find(x=>x.id===pid).stock+=n;audit('Stock added: '+n);save();render()}
function team(){return '<h2>Your virtual team</h2><div class="card"><div class="formgrid"><div><label>Candidate name</label><input id="candidate" placeholder="Candidate ka naam"></div><div><label>Experience level</label><select id="skill"><option value="0.45">Fresher</option><option value="0.65">Intermediate</option><option value="0.8">Experienced</option></select></div></div><button onclick="addCandidate()">+ Add candidate ('+active(p.team).length+'/10)</button></div><div class="grid">'+active(p.team).map(c=>{let rows=stats().rows.filter(r=>r.cid===c.id);return '<div class="card"><span class="pill">Virtual candidate</span><h2>'+esc(c.name)+'</h2><p>Skill: '+Math.round(c.skill*100)+'/100</p><p><b>'+fmt(rows.reduce((s,r)=>s+r.points,0))+'</b> achieved points</p><button class="secondary" onclick="renameCandidate(\''+c.id+'\')">Rename</button> <button class="danger" onclick="archive(\'team\',\''+c.id+'\')">Remove</button></div>'}).join('')+'</div>'}
function addCandidate(){if(active(p.team).length>=10)return message('Maximum 10 active candidates');let name=document.getElementById('candidate').value.trim();if(!name)return message('Naam dalein');p.team.push({id:id(),name,skill:num(document.getElementById('skill').value)});save();render()}
function renameCandidate(cid){let c=p.team.find(x=>x.id===cid),s=prompt('Candidate name',c.name);if(s?.trim()){c.name=s.trim();save();render()}}
function archive(kind,cid){if(!confirm('Archive/remove karein? Past reports preserved rahengi.'))return;p[kind].find(x=>x.id===cid).archived=true;save();render()}
function isPlanningOpen(){if(p.run.mode==='training')return editable();return editable()&&Date.now()>=Date.parse(dayDate(current().n)+'T10:00:00+05:30')&&Date.now()<Date.parse(dayDate(current().n)+'T18:00:00+05:30')}
function planning(){let d=current(),allowed=isPlanningOpen();return '<div class="row between"><h2>Day '+d.n+' · 10 AM planning</h2><button '+(!allowed?'disabled':'')+' onclick="autoPlan()">Suggest balanced plan</button></div><p class="muted">Units × product points = target points. Visits aur follow-ups candidate ki poori day workload hain. Maximum 2 coached candidates per day.</p>'+(!allowed?'<div class="warning">Plan locked. Training mein next day kholein; real time mein 10 AM–6 PM IST planning hoti hai.</div>':'')+(!active(p.team).length||!active(p.products).length?'<div class="card empty">Pehle Products aur Team add karein.</div>':'')+active(p.team).map(c=>{let pl=planFor(c.id);return '<div class="card"><div class="row between"><h3>'+esc(c.name)+'</h3><span class="pill">Target '+fmt(plannedPoints(pl))+' points</span></div><fieldset style="border:0;padding:0" '+(!allowed?'disabled':'')+'><div class="formgrid"><div><label>Market</label><select onchange="setPlan(\''+c.id+'\',\'market\',this.value)"><option value="">Unassigned</option>'+p.markets.map(m=>'<option '+(pl.market===m.id?'selected':'')+' value="'+m.id+'">'+esc(m.name)+'</option>').join('')+'</select></div><div><label>Shop/customer visits</label><input type="number" min="0" max="40" value="'+pl.visits+'" onchange="setPlan(\''+c.id+'\',\'visits\',this.value)"></div><div><label>Follow-ups (of visits)</label><input type="number" min="0" max="40" value="'+pl.followups+'" onchange="setPlan(\''+c.id+'\',\'followups\',this.value)"></div><div><label>Priority</label><select onchange="setPlan(\''+c.id+'\',\'priority\',this.value)">'+['Normal','High'].map(x=>'<option '+(pl.priority===x?'selected':'')+'>'+x+'</option>').join('')+'</select></div></div><div class="formgrid">'+active(p.products).map(x=>'<div><label>'+esc(x.name)+' · target units</label><input type="number" min="0" max="10000" value="'+num(pl.targets[x.id])+'" onchange="setTarget(\''+c.id+'\',\''+x.id+'\',this.value)"></div>').join('')+'</div><div class="row"><label><input type="checkbox" style="width:auto" '+(pl.coaching?'checked':'')+' onchange="setPlan(\''+c.id+'\',\'coaching\',this.checked)"> Coaching session</label><label><input type="checkbox" style="width:auto" '+(pl.punch?'checked':'')+' onchange="setPlan(\''+c.id+'\',\'punch\',this.checked)"> Simulated market punch</label></div><label>Task / manager note</label><input value="'+esc(pl.note)+'" placeholder="Example: 5 pending customers ko follow-up" onchange="setPlan(\''+c.id+'\',\'note\',this.value)"></fieldset></div>'}).join('')}
function setPlan(cid,k,v){if(!isPlanningOpen())return message('Plan locked');let pl=planFor(cid);if(['visits','followups'].includes(k)){v=Math.floor(Math.max(0,Math.min(40,num(v))));if(k==='followups')v=Math.min(v,pl.visits)}if(k==='coaching'&&v&&Object.values(current().plans).filter(x=>x.coaching).length>=2){render();return message('Daily coaching limit: 2 candidates')}pl[k]=v;if(k==='visits')pl.followups=Math.min(pl.followups,v);audit('Plan updated: '+k);save();render()}
function setTarget(cid,pid,v){if(!isPlanningOpen())return;planFor(cid).targets[pid]=Math.floor(Math.max(0,Math.min(10000,num(v))));audit('Target assigned');save();render()}
function autoPlan(){if(!isPlanningOpen())return;if(!active(p.team).length||!active(p.products).length)return message('Team aur product add karein');if(!confirm('Current day ka plan replace karke balanced targets suggest karein?'))return;let remaining=Math.max(0,p.target-stats().points),count=active(p.team).length,prod=active(p.products);active(p.team).forEach((c,i)=>{let pl=planFor(c.id);pl.market=p.markets[i%p.markets.length]?.id||'';pl.visits=20;pl.followups=5;pl.coaching=i<2;pl.punch=true;pl.targets={};prod.forEach(x=>pl.targets[x.id]=Math.ceil(remaining/(6-current().n)/count/prod.length/x.points));});audit('Manager accepted auto plan');save();render()}
function coverage(){let assigned=new Set(Object.values(current().plans).map(x=>x.market).filter(Boolean));return p.markets.length?Math.round(assigned.size/p.markets.length*100):0}
function marketView(){return '<h2>Territory · East Delhi training area</h2><p class="muted">Approximate schematic — navigation ya official district boundary nahi. Market pin chunein; map par click karke move karein. Candidate allocation Plan tab mein karein.</p><div class="card"><div class="row">'+p.markets.map(m=>'<button class="'+(selectedMarket===m.id?'':'secondary')+'" onclick="selectedMarket=\''+m.id+'\';render()">'+esc(m.name)+'</button>').join('')+'</div><p>Coverage: <b>'+coverage()+'%</b> · '+p.markets.filter(m=>!Object.values(current().plans).some(x=>x.market===m.id)).map(m=>esc(m.name)).join(', ')+' uncovered</p><div id="map" onclick="movePin(event)">'+(p.mapImage?'<img alt="Imported market map" src="'+p.mapImage+'">':'<svg viewBox="0 0 800 500" style="width:100%;display:block"><rect width="800" height="500" fill="#e8f0eb"/><path d="M70 0Q210 160 100 500" fill="none" stroke="#b1d6e8" stroke-width="65"/><g stroke="#fff" stroke-width="22"><path d="M0 230L800 140M260 0L460 500M0 440L800 290"/></g><g stroke="#ccd9cd" stroke-width="2" fill="none"><path d="M0 230L800 140M260 0L460 500M0 440L800 290"/></g><text x="38" y="465" fill="#577d91" font-size="18">Yamuna · schematic</text></svg>')+p.markets.map(m=>'<button class="pin" style="left:'+m.x+'%;top:'+m.y+'%" onclick="event.stopPropagation();selectedMarket=\''+m.id+'\';render()">'+esc(m.name)+' · '+Object.values(current().plans).filter(x=>x.market===m.id).length+'</button>').join('')+'</div><p class="row"><button class="secondary" onclick="importMap()">Import own/licensed map image</button><button class="secondary" onclick="addMarket()">+ Market</button><button class="secondary" onclick="openMaps()">Open Google Maps ↗ (online)</button></p><small>Saved map image aur pins offline rehte hain. Google Maps online external service hai. Punch simulated hai.</small></div>'}
function movePin(e){if(!selectedMarket)return message('Pehle market select karein');let r=document.getElementById('map').getBoundingClientRect(),m=p.markets.find(x=>x.id===selectedMarket);if(!m)return;m.x=Math.max(3,Math.min(97,(e.clientX-r.left)/r.width*100));m.y=Math.max(3,Math.min(97,(e.clientY-r.top)/r.height*100));save();render()}
function addMarket(){let name=prompt('Market name');if(!name?.trim())return;p.markets.push({id:id(),name:name.trim(),x:50,y:50,demand:.75});save();render()}
function openMaps(){let m=p.markets.find(x=>x.id===selectedMarket);window.open('https://www.google.com/maps/search/?api=1&query='+encodeURIComponent((m?.name||'East Delhi')+' Delhi India'),'_blank','noopener')}
function importMap(){let f=document.createElement('input');f.type='file';f.accept='image/png,image/jpeg';f.onchange=()=>{let file=f.files[0];if(!file)return;if(file.size>1500000||!['image/png','image/jpeg'].includes(file.type))return message('PNG/JPEG under 1.5 MB choose karein');let r=new FileReader;r.onload=()=>{p.mapImage=r.result;save();render()};r.readAsDataURL(file)};f.click()}
function dayDate(n){return new Date(Date.parse(p.run.start+'T00:00:00+05:30')+(n-1)*86400000+19800000).toISOString().slice(0,10)}
function randomFor(seed){let h=2166136261;for(let c of seed)h=Math.imul(h^c.charCodeAt(0),16777619);return()=>{h+=0x6D2B79F5;let t=h;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296}}
function closeDay(){let d=current();if(d.closed)return;let rng=randomFor(p.run.seed+'|'+d.n),rows=[];let candidates=active(p.team).slice();if(candidates.length)candidates=candidates.slice(d.n%candidates.length).concat(candidates.slice(0,d.n%candidates.length));for(let c of candidates){let pl=d.plans[c.id];if(!pl)continue;let m=p.markets.find(x=>x.id===pl.market),event=rng(),factor=event<.15?.65:event>.85?1.2:1,reason=event<.15?'Low footfall':event>.85?'Strong demand':'Normal demand';let contacts=m?Math.floor(pl.visits*(.68+rng()*.3)):0;let targetProducts=active(p.products).filter(x=>num(pl.targets[x.id])>0);let left=contacts;for(let [i,x] of targetProducts.entries()){let contacted=i===targetProducts.length-1?left:Math.floor(contacts/targetProducts.length);left-=contacted;let fit=!x.fit||x.fit===pl.market?1:.7;let leads=Math.min(contacted,Math.floor(contacted*(m?.demand||0)*fit*factor));let conversion=Math.min(.9,c.skill*.52+(pl.coaching?.12:0)+Math.min(.12,pl.followups/Math.max(1,pl.visits)*.3));let potential=Math.floor(leads*conversion*(.8+rng()*.4));let units=Math.min(x.stock,potential);x.stock-=units;rows.push({day:d.n,date:dayDate(d.n),cid:c.id,candidate:c.name,market:m?.name||'Unassigned',product:x.name,pid:x.id,targetUnits:num(pl.targets[x.id]),target:num(pl.targets[x.id])*x.points,units,points:units*x.points,revenue:units*x.price,contacts:contacted,leads,coaching:pl.coaching,reason:reason+(units<potential?' · stock limited':'')+(!m?' · no market':''),note:pl.note});}}d.rows=rows;d.closed=true;d.generatedAt=new Date().toISOString();d.scheduledAt=dayDate(d.n)+'T18:00:00+05:30';d.management=management(d);audit('Day finalized');save()}
function management(d){let plans=active(p.team).map(c=>d.plans[c.id]).filter(Boolean),n=active(p.team).length||1;let planning=25*plans.filter(x=>plannedPoints(x)>0).length/n,workload=20*plans.filter(x=>x.visits>0&&x.visits<=30&&x.followups<=x.visits).length/n,allocation=20*plans.filter(x=>x.market).length/n,coaching=20*Math.min(1,plans.filter(x=>x.coaching||x.followups>0).length/n),cover=15*coverage()/100;return {planning,workload,allocation,coaching,cover,total:Math.round(planning+workload+allocation+coaching+cover)}}
function nextDay(){if(current().closed&&current().n<5)p.run.days.push({n:current().n+1,plans:{},closed:false,rows:[]});save()}
function advance(){if(p.run.mode!=='training')return;if(complete())return message('5 days complete. Settings se new run start karein.');if(current().closed)nextDay();else{if(!confirm('Aaj ka plan lock karke final report generate karein?'))return;closeDay();tab='Reports'}render()}
function reconcile(){if(!p||p.run.mode!=='real')return;for(let i=0;i<5;i++){let d=current();if(!d.closed&&Date.now()>=Date.parse(dayDate(d.n)+'T18:00:00+05:30'))closeDay();if(d.closed&&d.n<5&&Date.now()>=Date.parse(dayDate(d.n+1)+'T10:00:00+05:30'))nextDay();else break;}}
function reports(){let s=stats();return '<div class="row between"><h2>Performance reports</h2><div class="row"><button onclick="exportXlsx()">Download Excel .xlsx</button><button class="secondary" onclick="exportCsv()">CSV</button><button class="secondary" onclick="window.print()">Print</button></div></div><div class="grid">'+stat('Total achievement',fmt(s.points),'points')+stat('Company attainment',p.target?(s.points/p.target*100).toFixed(1)+'%':'N/A','Target '+fmt(p.target))+stat('Remaining',fmt(Math.max(0,p.target-s.points)),'points')+'</div><div class="card"><h3>Five-day target vs achievement</h3>'+p.run.days.filter(x=>x.closed).map(d=>{let t=d.rows.reduce((s,r)=>s+r.target,0),a=d.rows.reduce((s,r)=>s+r.points,0);return '<p><b>Day '+d.n+'</b> · '+a+' / '+t+' points <small>· Management score '+d.management.total+'/100</small></p><div class="bar"><span style="width:'+Math.min(100,t?a/t*100:0)+'%"></span></div>'}).join('')+(!s.rows.length?'<p class="muted">Abhi report nahi bani. Plan banakar Training mode mein day close karein.</p>':'')+'</div><div class="card table"><table><tr><th>Day</th><th>Candidate</th><th>Market</th><th>Product</th><th>Target pts</th><th>Actual pts</th><th>Attainment</th><th>Units</th><th>Reason</th></tr>'+s.rows.map(r=>'<tr><td>'+r.day+'</td><td>'+esc(r.candidate)+'</td><td>'+esc(r.market)+'</td><td>'+esc(r.product)+'</td><td>'+r.target+'</td><td>'+r.points+'</td><td>'+(r.target?(r.points/r.target*100).toFixed(1)+'%':'N/A')+'</td><td>'+r.units+'</td><td>'+esc(r.reason)+'</td></tr>').join('')+'</table></div><div class="card"><h3>What drives your result?</h3><p class="help">Market demand × product fit → qualified leads. Candidate skill, coaching aur follow-ups conversion improve karte hain. Sales available stock se capped hain. Target badhane se sales automatically nahi badhti. Random demand daily change hoti hai; refresh se results change nahi hote.</p><p class="help">Management score: planning 25 + feasible workload 20 + market assignment 20 + coaching/follow-up 20 + coverage 15. Score sales points se alag hai.</p><ol class="help"><li>Uncovered markets ko allocate karein aur product-market fit check karein.</li><li>Weak candidates ko coaching dein; visits ke andar follow-up schedule karein.</li><li>Stock aur realistic target check karke agla day plan karein.</li></ol></div>'}
function settings(){return '<h2>Workspace settings</h2><div class="card"><div class="formgrid"><div><label>Company name</label><input id="company" value="'+esc(p.company)+'"></div><div><label>Five-day company target (points)</label><input type="number" id="companyTarget" value="'+p.target+'" min="1"></div></div><button onclick="saveSettings()">Save company</button></div><div class="card"><h3>Simulation clock</h3><p>Current mode: <b>'+p.run.mode+'</b> · campaign start '+p.run.start+'</p><button class="secondary" onclick="switchMode()">Switch to '+(p.run.mode==='training'?'real-time IST':'training')+'</button><p class="help">Training: close day manually, then Next Day. Real-time: 10 AM planning, 6 PM results, five calendar days. App closed/suspended ho toh report next open par generate hogi. Missed plan = no sales; historical actions invent nahi hote.</p><button class="danger" onclick="resetRun()">Archive & start new 5-day run</button></div><div class="card"><h3>Backup & profiles</h3><p class="help">Local device/browser data hai. Browser data clear karne ya file move karne se data unavailable ho sakta hai. JSON backup download karke rakhna zaroori hai. Same SALES/SALES login sab learners ke liye training gate hai; secure private authentication nahi.</p><p>Last backup: '+esc(p.lastBackup||'Not yet')+'</p><div class="row"><button onclick="backup()">Download JSON backup</button><button class="secondary" onclick="importBackup()">Import as new profile</button><button class="secondary" onclick="profiles()">Switch learner</button></div></div><div class="card"><h3>Desktop / Android use</h3><ol class="help"><li>HTML file download karke browser mein open karein. Internet core app ke liye required nahi.</li><li>Login: SALES / SALES, phir apna learner profile banayein.</li><li>Products, Team, Markets aur Plan fill karein. Training mode mein 5 din practice karein.</li><li>Reports se actual XLSX/CSV aur Settings se JSON backup download karein.</li><li>Android par file ko JavaScript-capable browser/local HTML viewer se open karein. File manager preview mein scripts/storage/downloads blocked ho sakte hain; device-specific support varies. Yeh HTML file hai, APK nahi.</li></ol><p class="help">Google Maps button optional online hai. Offline map schematic ya aapka imported licensed image hai. Physical GPS tracking aur separate real employee devices ka live sync included nahi.</p></div>'}
function saveSettings(){let c=document.getElementById('company').value.trim(),t=num(document.getElementById('companyTarget').value);if(!c||t<=0)return message('Valid company aur target dein');p.company=c;p.target=t;audit('Company settings changed');save();render()}
function switchMode(){if(!confirm('Mode change karein? Real-time mein elapsed days finalize ho sakte hain.'))return;p.run.mode=p.run.mode==='training'?'real':'training';save();reconcile();render()}
function resetRun(){if(!confirm('Current campaign archive hoga. Team/products rahenge; remaining stock carry forward hoga. Continue?'))return;p.history.push(JSON.parse(JSON.stringify(p.run)));p.run=newRun();audit('New run');save();render()}
function sample(){if(p.products.length||p.team.length)return message('Sample sirf empty workspace mein load hota hai. Naya profile bana sakte hain.');p.products=[{id:id(),name:'Mobile Protection',price:499,points:10,stock:300,fit:''},{id:id(),name:'Premium Accessories',price:999,points:15,stock:180,fit:''}];p.team=['Aman','Priya','Rahul','Neha','Vikram','Simran'].map((name,i)=>({id:id(),name,skill:.45+i*.065}));save();render();message('Sample ready. Plan tab se balanced plan assign karein.')}
function download(name,data,type){let blob=data instanceof Blob?data:new Blob([data],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),30000)}
function backup(){p.lastBackup=new Date().toISOString();save();download('sales-lab-backup-'+p.id+'.json',JSON.stringify({version:1,profile:p},null,2),'application/json');render()}
function importBackup(){let f=document.createElement('input');f.type='file';f.accept='.json';f.onchange=async()=>{try{let file=f.files[0];if(!file)return;if(file.size>4000000)throw Error('File too large');let d=JSON.parse(await file.text()),q=d.profile;if(d.version!==1||!q||typeof q.name!=='string'||!Array.isArray(q.team)||!Array.isArray(q.products)||!Array.isArray(q.markets)||!q.run||!Array.isArray(q.run.days)||q.run.days.length<1||q.run.days.length>5||!Array.isArray(q.history)||!Array.isArray(q.audit)||active(q.team).length>10||!Number.isFinite(q.target)||q.target<=0)throw Error('Invalid backup structure');for(let group of [q.team,q.products,q.markets]){let seen=new Set();for(let item of group){if(typeof item.id!=='string'||!/^[a-zA-Z0-9_-]+$/.test(item.id)||seen.has(item.id))throw Error('Invalid or duplicate ID');seen.add(item.id)}}if(!/^\d{4}-\d{2}-\d{2}$/.test(q.run.start)||!['training','real'].includes(q.run.mode)||typeof q.run.seed!=='string')throw Error('Invalid run');for(let x of q.products)if(typeof x.name!=='string'||!Number.isFinite(x.price)||x.price<0||!Number.isFinite(x.points)||x.points<=0||!Number.isInteger(x.stock)||x.stock<0)throw Error('Invalid products');for(let x of q.team)if(typeof x.name!=='string'||!Number.isFinite(x.skill)||x.skill<0||x.skill>1)throw Error('Invalid team');for(let x of q.markets)if(typeof x.name!=='string'||!Number.isFinite(x.x)||!Number.isFinite(x.y)||x.x<0||x.x>100||x.y<0||x.y>100)throw Error('Invalid map');if(q.mapImage&&!/^data:image\/(png|jpeg);base64,[A-Za-z0-9+/=]+$/.test(q.mapImage))throw Error('Invalid image');for(let [i,d] of q.run.days.entries()){if(d.n!==i+1||!Array.isArray(d.rows)||!d.plans||typeof d.closed!=='boolean')throw Error('Invalid day');for(let cid of Object.keys(d.plans))if(!/^[a-zA-Z0-9_-]+$/.test(cid))throw Error('Invalid plan ID');for(let pl of Object.values(d.plans))if(!pl.targets||!Number.isInteger(pl.visits)||pl.visits<0||pl.visits>40||!Number.isInteger(pl.followups)||pl.followups<0||pl.followups>pl.visits)throw Error('Invalid plan');for(let pl of Object.values(d.plans)){for(let [key,val] of Object.entries(pl.targets))if(!/^[a-zA-Z0-9_-]+$/.test(key)||!Number.isInteger(val)||val<0||val>10000)throw Error('Invalid target')}if(d.closed&&(!d.management||!Number.isFinite(d.management.total)))throw Error('Invalid score');for(let r of d.rows)for(let k of ['points','target','units','revenue'])if(!Number.isFinite(r[k])||r[k]<0)throw Error('Invalid report');}if(!confirm('Import '+q.name+' as a NEW independent profile?'))return;q.id=id();q.name+=' (imported)';db.profiles.push(q);p=q;logged=true;tab='Dashboard';save();render();message('Backup imported')}catch(e){message('Import failed: '+e.message)}};f.click()}
function salesTable(){return [['Day','Date','Candidate','Market','Product','Target units','Target points','Actual units','Actual points','Gap','Attainment %','Revenue INR','Contacts','Qualified leads','Coaching','Reason'],...stats().rows.map(r=>[r.day,r.date,r.candidate,r.market,r.product,r.targetUnits,r.target,r.units,r.points,r.target-r.points,r.target?Math.round(r.points/r.target*10000)/100:'N/A',r.revenue,r.contacts,r.leads,r.coaching?'Yes':'No',r.reason])]}
function exportCsv(){const safe=v=>{let s=String(v??'');if(typeof v==='string'&&/^[=+@\-\t\r]/.test(s))s="'"+s;return '"'+s.replace(/"/g,'""')+'"'};download('sales-report.csv','\ufeff'+salesTable().map(r=>r.map(safe).join(',')).join('\r\n'),'text/csv;charset=utf-8')}
// Minimal standards-based XLSX: inline strings + numeric cells in a stored ZIP. No external libraries.
const xml=s=>String(s??'').replace(/[\x00-\x08\x0b\x0c\x0e-\x1f]/g,'').replace(/[<>&"']/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;',"'":'&apos;'}[c]));
function zip(entries){let chunks=[],central=[],offset=0;const enc=new TextEncoder,crc=b=>{let c=0xffffffff;for(let x of b){c^=x;for(let k=0;k<8;k++)c=(c>>>1)^((c&1)?0xedb88320:0)}return(c^0xffffffff)>>>0};for(let [name,str] of entries){let n=enc.encode(name),b=enc.encode(str),c=crc(b),h=new Uint8Array(30+n.length),v=new DataView(h.buffer);v.setUint32(0,0x04034b50,true);v.setUint16(4,20,true);v.setUint32(14,c,true);v.setUint32(18,b.length,true);v.setUint32(22,b.length,true);v.setUint16(26,n.length,true);h.set(n,30);chunks.push(h,b);let z=new Uint8Array(46+n.length),w=new DataView(z.buffer);w.setUint32(0,0x02014b50,true);w.setUint16(4,20,true);w.setUint16(6,20,true);w.setUint32(16,c,true);w.setUint32(20,b.length,true);w.setUint32(24,b.length,true);w.setUint16(28,n.length,true);w.setUint32(42,offset,true);z.set(n,46);central.push(z);offset+=h.length+b.length;}let size=central.reduce((s,x)=>s+x.length,0),end=new Uint8Array(22),e=new DataView(end.buffer);e.setUint32(0,0x06054b50,true);e.setUint16(8,entries.length,true);e.setUint16(10,entries.length,true);e.setUint32(12,size,true);e.setUint32(16,offset,true);return new Blob([...chunks,...central,end],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'})}
function exportXlsx(){let s=stats();let sheets=[['Company Summary',[['Company',p.company],['Learner',p.name],['Run',p.run.id],['Company target',p.target],['Achieved points',s.points],['Revenue INR',s.revenue]]],['Daily Sales',salesTable()],['Team Performance',[['Candidate','Target points','Actual points'],...p.team.map(c=>{let r=s.rows.filter(x=>x.cid===c.id);return[c.name,r.reduce((a,x)=>a+x.target,0),r.reduce((a,x)=>a+x.points,0)]})]],['Products',[['Product','Price INR','Points per unit','Remaining stock'],...p.products.map(x=>[x.name,x.price,x.points,x.stock])]],['Tasks',[['Day','Candidate','Visits assigned','Follow-ups assigned','Market','Coaching','Simulated punch','Note'],...p.run.days.flatMap(d=>Object.entries(d.plans).map(([cid,pl])=>[d.n,p.team.find(x=>x.id===cid)?.name||cid,pl.visits,pl.followups,p.markets.find(x=>x.id===pl.market)?.name||'',pl.coaching?'Yes':'No',pl.punch?'Yes':'No',pl.note]))]],['Market Allocation',[['Day','Market','Candidate'],...p.run.days.flatMap(d=>Object.entries(d.plans).map(([cid,pl])=>[d.n,p.markets.find(x=>x.id===pl.market)?.name||'',p.team.find(x=>x.id===cid)?.name||cid]))]]];const ns='http://schemas.openxmlformats.org/spreadsheetml/2006/main';let files=[['[Content_Types].xml','<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>'+sheets.map((_,i)=>'<Override PartName="/xl/worksheets/sheet'+(i+1)+'.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>').join('')+'</Types>'],['_rels/.rels','<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>'],['xl/workbook.xml','<workbook xmlns="'+ns+'" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets>'+sheets.map(([n],i)=>'<sheet name="'+xml(n)+'" sheetId="'+(i+1)+'" r:id="rId'+(i+1)+'"/>').join('')+'</sheets></workbook>'],['xl/_rels/workbook.xml.rels','<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'+sheets.map((_,i)=>'<Relationship Id="rId'+(i+1)+'" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet'+(i+1)+'.xml"/>').join('')+'</Relationships>']];sheets.forEach(([name,rows],i)=>files.push(['xl/worksheets/sheet'+(i+1)+'.xml','<worksheet xmlns="'+ns+'"><sheetData>'+rows.map((r,j)=>'<row r="'+(j+1)+'">'+r.map(v=>typeof v==='number'?'<c><v>'+v+'</v></c>':'<c t="inlineStr"><is><t xml:space="preserve">'+xml(v)+'</t></is></c>').join('')+'</row>').join('')+'</sheetData></worksheet>']));download('sales-manager-report.xlsx',zip(files))}
function start(){document.getElementById('app').innerHTML='<main class="login"><div class="card"><span class="pill">ROHITGUPTASKILLS • SALES LAB</span><h1>Practice being a<br>sales manager.</h1><p class="muted">Your team. Your territory. Five days to learn.</p><label>User ID</label><input id="user" placeholder="SALES" autocomplete="username"><p><label>Password</label><input id="pass" type="password" placeholder="SALES" autocomplete="current-password"></p><button style="width:100%" onclick="login()">Enter Sales Lab →</button><p class="help">Training login: <b>SALES / SALES</b><br>Offline simulation • No account required</p></div></main>'}start();setInterval(()=>{if(p&&p.run.mode==='real'){let before=JSON.stringify(p.run.days.map(x=>x.closed));reconcile();if(before!==JSON.stringify(p.run.days.map(x=>x.closed)))render()}},30000);document.addEventListener('visibilitychange',()=>{if(!document.hidden&&p){reconcile();render()}});window.addEventListener('focus',()=>{if(p){reconcile();render()}});
